name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch pinned open sources
        run: python3 data-pipeline/fetch_sources.py

      - name: Build ketaby.db
        run: |
          mkdir -p app/src/main/assets
          python3 data-pipeline/build_db.py app/src/main/assets/ketaby.db

      - name: Pipeline tests
        run: |
          python3 data-pipeline/tests/test_bw_decode.py
          python3 data-pipeline/tests/test_translit.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ketaby-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
