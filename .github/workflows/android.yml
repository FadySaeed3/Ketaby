name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch pinned open sources
        run: python3 data-pipeline/fetch_sources.py

      - name: Build ketaby.db
        run: |
          mkdir -p app/src/main/assets
          python3 data-pipeline/build_db.py app/src/main/assets/ketaby.db

      - name: Pipeline tests
        run: |
          python3 data-pipeline/tests/test_bw_decode.py
          python3 data-pipeline/tests/test_translit.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Signing key (from secret, if set)
        env:
          KS_B64: ${{ secrets.KETABY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ketaby.jks"
            echo "KETABY_KEYSTORE=$RUNNER_TEMP/ketaby.jks" >> "$GITHUB_ENV"
            echo "fixed signing key: yes"
          else
            echo "fixed signing key: no (secret KETABY_KEYSTORE_B64 not set)"
          fi

      - name: Build debug APK
        env:
          KETABY_KEY_PASS: ${{ secrets.KETABY_KEY_PASS }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ketaby-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Releases: when .github/release-notes/v<versionName>.md exists and that
      # release is not on GitHub yet, a push to main publishes it with the APK.
      # Publishing a release by hand (or pushing a v* tag) attaches the APK too.
      - name: Publish release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KETABY_KEY_PASS: ${{ secrets.KETABY_KEY_PASS }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          fi
          notes=".github/release-notes/$TAG.md"
          exists=no; gh release view "$TAG" >/dev/null 2>&1 && exists=yes
          if [ "${{ github.ref }}" = "refs/heads/main" ] && { [ ! -f "$notes" ] || [ "$exists" = yes ]; }; then
            echo "no new release for $TAG (notes file: $([ -f "$notes" ] && echo yes || echo no), already published: $exists)"
            exit 0
          fi
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "ketaby-$TAG.apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs "ketaby-$TAG.apk" | grep -i "SHA-256"
          if [ "$exists" = yes ]; then
            gh release upload "$TAG" "ketaby-$TAG.apk" --clobber
          else
            [ -f "$notes" ] || notes=/dev/null
            gh release create "$TAG" "ketaby-$TAG.apk" --target "$GITHUB_SHA" --prerelease \
              --title "كتابي $TAG" --notes-file "$notes"
          fi

  # Installs the APK on an emulator, taps through the main screens, and prints
  # screenshots (base64) and crash logs into the job log for review.
  smoke:
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ketaby-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: shots/
          retention-days: 14
